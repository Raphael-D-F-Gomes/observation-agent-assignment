[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "observe"
version = "0.1.0"
description = "Deterministic local analysis of a mail corpus."
requires-python = ">=3.11"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["src"]
